name: CI/CD — проверка и деплой

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # ручной запуск из вкладки Actions

jobs:
  # ========== JOB 1: ПРОВЕРКА ==========
  # Собираем образ и проверяем, что сервис действительно отвечает.
  # Если этот джоб упал, деплой не начнётся.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t time-server:ci .

      - name: Run container
        run: docker run -d --name api-ci -p 8000:8000 time-server:ci

      - name: Wait for service
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/time >/dev/null; then
              echo "сервис поднялся за ${i} с"
              exit 0
            fi
            sleep 1
          done
          echo "сервис не ответил за 20 с"
          docker logs api-ci
          exit 1

      - name: Smoke test endpoints
        run: |
          set -e
          curl -sf http://localhost:8000/ | grep -q "Добро пожаловать"
          curl -sf http://localhost:8000/time | grep -q utc_time
          curl -sf http://localhost:8000/date | grep -q utc_date
          curl -sf http://localhost:8000/datetime | grep -q utc_datetime

          # Конвертация часовых поясов: 12:00 MSK = 04:00 EST (зимой разница 8 часов)
          OUT=$(curl -sf "http://localhost:8000/convert?time_str=2026-11-10T12:00:00&from_tz=Europe/Moscow&to_tz=America/New_York")
          echo "$OUT"
          echo "$OUT" | grep -q "2026-11-10T04:00:00-05:00"

          # Swagger и схема отдаются
          curl -sf -o /dev/null http://localhost:8000/docs
          curl -sf -o /dev/null http://localhost:8000/openapi.json

          echo "все проверки пройдены"

      - name: Container logs on failure
        if: failure()
        run: docker logs api-ci || true

  # ========== JOB 2: ДЕПЛОЙ ==========
  # Выполняется только после успешной проверки и только для main.
  # Собирает контейнер на сервере и проверяет его через nginx.
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts 2>/dev/null

          # На стороне сервера ключу разрешена единственная команда — deploy.sh.
          # Поэтому произвольный код по этому ключу выполнить нельзя.
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=15 \
              ${{ secrets.USERNAME }}@${{ secrets.HOST }}

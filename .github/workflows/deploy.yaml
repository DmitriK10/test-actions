name: CI/CD — проверка и деплой

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:        # ручной запуск из вкладки Actions

jobs:
  # ========== JOB 1: ПРОВЕРКА ==========
  # Собираем образ и проверяем, что сервис действительно отвечает.
  # Если этот джоб упал, деплой не начнётся.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t time-server:ci .

      - name: Run container
        run: docker run -d --name api-ci -p 8000:8000 time-server:ci

      - name: Wait for service
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/time >/dev/null; then
              echo "сервис поднялся за ${i} с"
              exit 0
            fi
            sleep 1
          done
          echo "сервис не ответил за 20 с"
          docker logs api-ci
          exit 1

      - name: Smoke test endpoints
        run: |
          set -e
          curl -sf http://localhost:8000/ | grep -q "Добро пожаловать"
          curl -sf http://localhost:8000/time | grep -q utc_time
          curl -sf http://localhost:8000/date | grep -q utc_date
          curl -sf http://localhost:8000/datetime | grep -q utc_datetime

          # Конвертация часовых поясов: 12:00 MSK = 04:00 EST (зимой разница 8 часов)
          OUT=$(curl -sf "http://localhost:8000/convert?time_str=2026-11-10T12:00:00&from_tz=Europe/Moscow&to_tz=America/New_York")
          echo "$OUT"
          echo "$OUT" | grep -q "2026-11-10T04:00:00-05:00"

          # Swagger и схема отдаются
          curl -sf -o /dev/null http://localhost:8000/docs
          curl -sf -o /dev/null http://localhost:8000/openapi.json

          echo "все проверки пройдены"

      - name: Container logs on failure
        if: failure()
        run: docker logs api-ci || true

  # ========== JOB 2: ДЕПЛОЙ ==========
  # Выполняется только после успешной проверки и только для main.
  # Собирает контейнер на сервере и проверяет его через nginx.
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Проверка секретов
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.PORT }}
        run: |
          # Печатаем только длины: значения секретов в лог не попадают.
          echo "HOST: ${#HOST} символов"
          echo "USERNAME: ${#USERNAME} символов"
          echo "SSH_KEY: ${#SSH_KEY} символов"
          echo "PORT: ${#PORT} символов"

          [ -z "$HOST" ] && { echo "::error::секрет HOST не задан"; exit 1; }
          [ -z "$USERNAME" ] && { echo "::error::секрет USERNAME не задан"; exit 1; }
          [ -z "$SSH_KEY" ] && { echo "::error::секрет SSH_KEY не задан"; exit 1; }

          case "$SSH_KEY" in
            *"BEGIN OPENSSH PRIVATE KEY"*) echo "ключ похож на OpenSSH" ;;
            *) echo "::error::SSH_KEY не похож на приватный ключ OpenSSH"; exit 1 ;;
          esac

      - name: Deploy via SSH
        id: deploy_step
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PORT: ${{ secrets.PORT }}
        run: |
          mkdir -p ~/.ssh

          # Нормализация ключа. Три вещи ломают ключ при вставке в поле секрета:
          # литеральные \n вместо переводов строк, CRLF из Windows и пробелы по краям.
          printf '%s' "$SSH_KEY" \
            | sed 's/\\n/\n/g' \
            | tr -d '\r' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
            > ~/.ssh/deploy_key

          # Не через `[ ... ] && echo`: при set -e неудачная проверка роняет шаг
          # без сообщения. Обычный if безопасен.
          if [ -n "$(tail -c1 ~/.ssh/deploy_key)" ]; then
            echo >> ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          echo "строк в ключе: $(wc -l < ~/.ssh/deploy_key)"
          echo "первая строка: $(head -1 ~/.ssh/deploy_key | cut -c1-45)"
          echo "последняя строка: $(tail -1 ~/.ssh/deploy_key | cut -c1-45)"
          echo "пользователь: '$USERNAME'  хост: '$HOST'  порт: '${PORT:-22}'"

          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH_KEY не читается как приватный ключ"
            ssh-keygen -y -f ~/.ssh/deploy_key 2>&1 | head -3
            exit 1
          fi

          FP=$(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')
          echo "отпечаток ключа: $FP"
          echo "ожидается:       SHA256:pmJCRJURdpXJGAivahaz/L39irOh/KceypBaBkzCNV8"
          if [ "$FP" != "SHA256:pmJCRJURdpXJGAivahaz/L39irOh/KceypBaBkzCNV8" ]; then
            echo "::error::В секрете SSH_KEY лежит не тот ключ, который прописан на сервере"
            exit 1
          fi

          if [ "$USERNAME" != "deploy" ]; then
            echo "::error::USERNAME должен быть deploy, а не '$USERNAME'. Ключ прописан только для deploy."
            exit 1
          fi

          SSH_PORT="${PORT:-22}"

          # ssh-keyscan здесь не используется: на части версий OpenSSH он падает
          # на KEX-методе sntrup761x25519 и не отдаёт ключ хоста, из-за чего
          # StrictHostKeyChecking=yes потом ругается «Host key verification failed».
          # accept-new доверяет ключу при первом подключении и запоминает его;
          # для одноразового раннера это эквивалентно TOFU и MITM не пропускает
          # после первого контакта. Ключ к тому же ограничен одной командой.
          ssh -i ~/.ssh/deploy_key \
              -p "$SSH_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o BatchMode=yes \
              -o LogLevel=VERBOSE \
              "$USERNAME@$HOST"

      # Диагностика отправляется на сервер, потому что логи Actions
      # доступны только владельцу репозитория. Тело — сводка о ключе.
      # Токен в пути не секрет: приёмник только дописывает строки в лог,
      # размер тела ограничен, а сам лог ротируется.
      - name: Отправить диагностику
        if: always()
        env:
          HOST: ${{ secrets.HOST }}
          STEP_OUTCOME: ${{ steps.deploy_step.outcome }}
        run: |
          {
            echo "run: ${{ github.run_number }} sha: ${{ github.sha }}"
            echo "deploy outcome: $STEP_OUTCOME"
            echo "--- ключ ---"
            if [ -f ~/.ssh/deploy_key ]; then
              echo "строк: $(wc -l < ~/.ssh/deploy_key)"
              echo "первая: $(head -1 ~/.ssh/deploy_key | cut -c1-45)"
              echo "последняя: $(tail -1 ~/.ssh/deploy_key | cut -c1-45)"
              echo "отпечаток: $(ssh-keygen -lf ~/.ssh/deploy_key 2>&1 | awk '{print $2}')"
            else
              echo "файла ключа нет"
            fi
            echo "--- переменные ---"
            echo "HOST='$HOST'"
            echo "USERNAME='${{ secrets.USERNAME }}'"
            echo "PORT='${{ secrets.PORT }}'"
          } > /tmp/diag.txt 2>&1
          curl -sS --max-time 20 -X POST --data-binary @/tmp/diag.txt \
            "http://$HOST/ci-diag-az8xj5mdjrgij8e3nne96nx6" || true
